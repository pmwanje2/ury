<!doctype html>
<html lang="{{ frappe.lang or 'en' }}" dir="{{ 'rtl' if (frappe.lang or 'en').split('-')[0] in ['ar','he','fa','ur','ku'] else 'ltr' }}">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="{{ (brand.favicon if brand and brand.favicon else '/assets/ury/Images/maximus-mark.svg') | e }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ (brand.name if brand and brand.name else 'Maximus Kitchen') | e }}</title>
  <script type="module" crossorigin src="/assets/ury/mosaic/assets/index-CxxbKfqX.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/ury/mosaic/assets/index-3IZd6M8W.css">
</head>

<body>
  <div id="app"></div>
  <footer class="py-2 text-center text-xs text-slate-500" style="padding:8px 16px;text-align:center;font-size:12px;color:#64748b">
    {{ (brand.name if brand and brand.name else 'Maximus Kitchen') | e }} · AGPL-3.0 · <a href="{{ brand_source_url | e }}" class="underline" style="color:inherit;text-decoration:underline">Source</a>
  </footer>
  <script>
      window.csrf_token = '{{ csrf_token }}';
      if (!window.frappe) window.frappe = {};
      if (!window.frappe.boot) window.frappe.boot = {};
      window.frappe.boot.ury_brand = {{ brand_json | default('null') | safe }};
    </script>
</body>

</html>

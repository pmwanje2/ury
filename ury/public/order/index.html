<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ (brand.favicon if brand and brand.favicon else '/assets/ury/Images/maximus-mark.svg') | e }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>{{ (brand.name if brand and brand.name else 'Maximus Order') | e }}</title>
    <script type="module" crossorigin src="/assets/ury/order/assets/index-DWfs8vbQ.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/ury/order/assets/index-Dacetll9.css">
  </head>
  <body>
    <div id="root"></div>
    <footer class="py-2 text-center text-xs text-muted-foreground">
      {{ (brand.name if brand and brand.name else 'Maximus Order') | e }} · AGPL-3.0 · <a href="{{ brand_source_url | e }}" class="underline" data-guest-i18n="footer.source">Source</a>
    </footer>
    <script>
      window.csrf_token = "{{ csrf_token }}";
      if (!window.frappe) window.frappe = {};
      window.app_name = {{ app_name | default('') | tojson }};
      frappe.boot = JSON.parse({{ boot | safe }});
    </script>
  </body>
</html>

name: POS tests

on:
  pull_request:
    branches: [maximus/v16-integration]
  push:
    branches: [maximus/v16-integration]

permissions:
  contents: read

jobs:
  pos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: package-lock.json

      # The root lock owns pos and its shared workspaces. Skip the legacy app postinstall.
      - name: Install locked dependencies
        run: npm --prefix .. ci --ignore-scripts --no-audit --no-fund
      - name: Check workflow contract
        run: node --test ../tests/pos-workflow.test.cjs
      - name: Run hermetic POS tests
        run: npm test --offline -- ./tests/ --maxWorkers=1
      # MenuItemCard and the other shared components are also rendered by serve.
      - name: Run shared UI component tests
        run: npm --prefix ../packages/ui test --offline -- --maxWorkers=1
      - name: Run serve tests
        run: npm --prefix ../serve test --offline -- --maxWorkers=1
      - name: Run frontend print configuration and POS print tests
        run: npm --prefix ../frontend test --offline -- src/pages/Dashboard/PrinterConfigPage.test.tsx src/pages/Pos/lib/print.test.ts --maxWorkers=1
      # The print-format tests render with the Jinja2 and MarkupSafe that Frappe v16 pins.
      - name: Install print Jinja
        run: 'python3 -m pip install --user --break-system-packages --no-deps --only-binary=:all: --require-hashes -r ../ury/ury/print_format/print-jinja-requirements.txt'
      - name: Run site-less Python tests
        run: |
          PYTHONPATH=.. python3 -m unittest ury.tests.unit.test_offline_capture_fixture
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_ury_kot_notes
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_ury_hold_fire
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_ury_table_bookings
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_order.test_split_bill_release
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_order.test_cancel_order_reason
          PYTHONPATH=.. python3 -m unittest ury.ury_pos.test_floor_pin
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_order.test_price_determination
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_menu.test_menu_price_upkeep
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_shown_price_is_billed
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_kds_display_window
          PYTHONPATH=.. python3 -m unittest ury.tests.unit.test_backfill_invoice_employee_attribution
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_availability_tiers
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_menu_availability_operations
          PYTHONPATH=.. python3 -m unittest ury.tests.unit.test_reservation_merge_safety
          PYTHONPATH=.. python3 -m unittest ury.ury.api.test_table_reservation_lifecycle
          PYTHONPATH=.. python3 -m unittest ury.ury_pos.test_pos_invoice_list_fields
          PYTHONPATH=.. python3 -m unittest ury.ury.print_format.test_print_format_waiter_name
          PYTHONPATH=.. python3 -m unittest ury.ury.print_format.test_print_format_escaping
          PYTHONPATH=.. python3 -m unittest ury.ury.print_format.test_print_format_fiscal_receipt
          PYTHONPATH=.. python3 -m unittest ury.ury.print_format.test_print_format_layout
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_order.test_merged_bill_submit_efris
          PYTHONPATH=.. python3 -m unittest ury.tests.unit.test_assistant_vendor_name
          PYTHONPATH=.. python3 -m unittest ury.ury.hooks.test_pos_invoice_money_integrity
          PYTHONPATH=.. python3 -m unittest ury.ury.doctype.ury_order.test_merged_bill_integrity
          PYTHONPATH=.. python3 -m unittest ury.ury_pos.test_add_check_and_tenders
